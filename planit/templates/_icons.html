{# Line icons, drawn here so no icon font or outside file is needed. #}

{# The app's mark: a ringed planet with a tick on it. docs/make_icons.py draws the same shape. #}
{% macro logo(size=28) %}
  <svg width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="10" fill="#2f6bff"></circle>
    <ellipse cx="16" cy="16" rx="15" ry="5.2" fill="none" stroke="#9cc0ff" stroke-width="2" transform="rotate(-24 16 16)"></ellipse>
    <path d="M10.4 9.2 A10 10 0 0 1 25.6 13.4" fill="none" stroke="#2f6bff" stroke-width="2.4"></path>
    <path d="M11.5 16.3l3.1 3.1 6-6.2" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
  </svg>
{% endmacro %}

{% macro icon(name, size=18) %}
  <svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == 'home' %}<path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path>
  {% elif name == 'tasks' %}<rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 10l2 2 4-4"></path><path d="M7 16h10"></path>
  {% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path>
  {% elif name == 'inbox' %}<path d="M3 13l3-8h12l3 8v6H3z"></path><path d="M3 13h5l1 3h6l1-3h5"></path>
  {% elif name == 'projects' %}<rect x="3" y="4" width="5" height="16" rx="1"></rect><rect x="10" y="4" width="5" height="11" rx="1"></rect><rect x="17" y="4" width="4" height="7" rx="1"></rect>
  {% elif name == 'teams' %}<circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16.5 14.5A5 5 0 0 1 21.5 19"></path>
  {% elif name == 'settings' %}<circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path>
  {% elif name == 'plus' %}<path d="M12 5v14M5 12h14"></path>
  {% elif name == 'pencil' %}<path d="M4 20l1-4L16 5a2 2 0 0 1 3 3L8 19z"></path><path d="M14 7l3 3"></path>
  {% elif name == 'trash' %}<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path>
  {% elif name == 'flag' %}<path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path>
  {% elif name == 'clock' %}<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
  {% elif name == 'comment' %}<path d="M4 5h16v11H9l-5 4z"></path>
  {% elif name == 'checklist' %}<path d="M4 6l2 2 3-3M4 13l2 2 3-3"></path><path d="M12 7h8M12 14h8M12 20h8"></path>
  {% elif name == 'more' %}<circle cx="5" cy="12" r="1.3" fill="currentColor"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor"></circle><circle cx="19" cy="12" r="1.3" fill="currentColor"></circle>
  {% elif name == 'arrow' %}<path d="M5 12h14M13 6l6 6-6 6"></path>
  {% elif name == 'back' %}<path d="M19 12H5M11 6l-6 6 6 6"></path>
  {% elif name == 'chevron-left' %}<path d="M15 6l-6 6 6 6"></path>
  {% elif name == 'chevron-right' %}<path d="M9 6l6 6-6 6"></path>
  {% elif name == 'check' %}<path d="M5 12l5 5 9-10"></path>
  {% elif name == 'link' %}<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path>
  {% elif name == 'person' %}<circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path>
  {% elif name == 'lock' %}<rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
  {% elif name == 'chart' %}<path d="M4 20V4M4 20h16"></path><rect x="7" y="12" width="3" height="5"></rect><rect x="12" y="8" width="3" height="9"></rect><rect x="17" y="5" width="3" height="12"></rect>
  {% elif name == 'list' %}<path d="M8 6h13M8 12h13M8 18h13"></path><circle cx="4" cy="6" r="1" fill="currentColor"></circle><circle cx="4" cy="12" r="1" fill="currentColor"></circle><circle cx="4" cy="18" r="1" fill="currentColor"></circle>
  {% endif %}
  </svg>
{% endmacro %}
